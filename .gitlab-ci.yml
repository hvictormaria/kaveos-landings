# Static site, no build. Publishes the repo root as GitLab Pages.
# Custom domains: Settings → Pages → New domain (one per subdomain), then DNS per the instructions shown there.
pages:
  stage: deploy
  image: alpine:3.20
  script:
    - mkdir -p public
    - cp -r index.html favicon.svg favicon-plain.svg robots.txt config.js tags.js shared.css shared.js play gut trade learn kocok id my ph br mx ng public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
